!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <div class="container mt-3 bg-warning rounded p-4">

        <div class="mb-3 mt-3">

            <h4 class="text-center text-primary">FORMULIR PENDAFTARAN SISWA BARU</h4>

            <input type="text" placeholder="Masukkan NIPD" class="form-control">
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
        </div>

        <div class="mb-3">
             <input type="text" placeholder="Email" class="form-control">
        </div>

        <div class="mb-3">
            <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
        </div>

        <div class="mb-3">
            <select class="Form-Select">
                <option>Pilih Jurusan</option>
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik Komputer Dan Jaringan</option>
                <option>Desain Komunikasi Visual</option>
                <option>Bisnis Digital</option>
                <option>Accounting</option>
            </select>
        </div>

        <div class="mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Marching Band</label>
        
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Paskibra</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Tari</label>
            </div>
    <div class="mb-3">
        <input class="form-check-input" type="radio">
        <label class="form-check-label">Laki-Laki</label>

        <input class="form-check-input" type="radio">
        <label class="form-check-label">Perempuan</label>
    </div>

    

        <button class="btn btn-danger">Simpan Data</button>
        <button class="btn btn-success">Hapus Data</button>

    </div>
    
</body>
